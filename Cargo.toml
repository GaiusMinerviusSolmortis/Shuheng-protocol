[workspace]
resolver = "2"
members = [
    "crates/harness-core",
    "crates/harness-ctrl",
    "crates/harness-echo",
    "crates/harness-editor",
    "crates/harness-service",
    "crates/harness-term",
    "crates/harness-memory",
    "crates/harness-agent",
    "crates/harness-mem",
    "crates/harness-skill",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
